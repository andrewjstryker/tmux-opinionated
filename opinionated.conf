#-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-#
#
# Opinionated
#
# A collection of tmux bindings packaged for the tmux plugin manager.
#
# General strategy:
#   paired lifecycle commands: lower case -> windows, upper case -> sessions
#   pane navigation, resizing, and splitting -> tmux-pain-control
#
#   use the following mnemonics:
#     c -> copy (opt-in); [ always enters copy mode
#     n -> new
#     d -> detach
#     r -> rename
#     x -> kill
#     m -> monitor
#     g -> gather (link a window)
#     X -> choose what to kill
#
#  reserve the following for plugins
#     s -> tmux-resurrect
#  copy mode
#     o -> open
#     C-o -> open higlighted text with $EDITOR
#     S-o -> search for the highlighted text
#
#-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-#

#-----------------------------------------------------------------------------#
#
# Bindings for sessions
#
#-----------------------------------------------------------------------------#

# session manipulation
bind-key N new-session -c "#{pane_current_path}" \; \
    command-prompt -I "#{session_name}" "rename-session '%%'" \; \
    command-prompt -I "#{window_name}" "rename-window '%%'"
bind-key R command-prompt -I "#{session_name}" "rename-session '%%'"

bind-key D detach-client
bind-key g command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

bind-key S if -F '#{s/off//:status}' 'set status off' 'set status on'

# Merge session with another one (e.g. move all windows)
# If you use adhoc 1-window sessions, and you want to preserve session upon exit
# but don't want to create a lot of small unnamed 1-window sessions around
# move all windows from current session to main named one (dev, work, etc)
bind-key M command-prompt -p "Session to merge with: " \
    "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# TODO: decide if this is worth having
# bind-key D if -F '#{session_many_attached}' \
#       'confirm-before -p "Detach other clients? (y/n)" "detach-client -a"' \
#       'display "Session has only 1 client attached"'

#-----------------------------------------------------------------------------#
#
# Bindings for windows
#
#-----------------------------------------------------------------------------#

# window manipulation
bind-key n new-window -c '#{pane_current_path}' \; \
  command-prompt -I '#{window_name}' 'rename-window %%'
bind-key r command-prompt -I "#{window_name}" "rename-window '%%'"

# Keep pain-control's c binding unless the user opts into mnemonic copying.
# Reloading with the option off restores pain-control's new-window behavior.
bind-key '[' copy-mode
if-shell -F '#{==:#{@opinionated-copy-on-c},on}' \
    'bind-key c copy-mode' \
    'bind-key c new-window -c "#{pane_current_path}"'
bind-key p paste-buffer
bind-key C-p choose-buffer

# navigate windows
bind-key -r C-Tab last-window
bind-key -r Tab last-pane
# Ctrl-arrows retain tmux's directional pane resizing.
bind-key -r C-Left resize-pane -L
bind-key -r C-Right resize-pane -R
bind-key -r M-Left previous-window
bind-key -r M-Right next-window
bind-key m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind-key v display-menu -T 'Silence monitoring' \
    'Set interval (seconds)' s 'command-prompt -p "Silence interval (seconds):" "set-window-option monitor-silence %%"' \
    'Disable' d 'set-window-option monitor-silence 0'


#-----------------------------------------------------------------------------#
#
# Bindings for panes
#
#-----------------------------------------------------------------------------#

# Pane layout and movement bindings belong to tmux-pain-control.
bind-key x confirm-before -p "kill-pane (y/n)" kill-pane
bind-key X display-menu -T 'Kill…' \
    'Pane' x 'confirm-before -p "kill-pane? (y/n)" kill-pane' \
    'Window' w 'confirm-before -p "kill-window? (y/n)" kill-window' \
    'Other windows' a 'confirm-before -p "kill other windows? (y/n)" "kill-window -a"' \
    'Session' s 'confirm-before -p "kill-session? (y/n)" kill-session' \
    'Server' S 'confirm-before -p "kill-server? (y/n)" kill-server'

#-----------------------------------------------------------------------------#
#
# Bindings for copy-mode
#
#-----------------------------------------------------------------------------#

# Scroll up/down by 1 line, half screen, whole screen
bind-key "-T" copy-mode-vi M-Up              send-keys -X scroll-up
bind-key "-T" copy-mode-vi M-Down            send-keys -X scroll-down
bind-key "-T" copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind-key "-T" copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind-key "-T" copy-mode-vi PageDown          send-keys -X page-down
bind-key "-T" copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
# TODO: resolve 'not in a mode'
#tmux bind-key "-T" copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
#tmux bind-key "-T" copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

