#! /usr/bin/env bash
#-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-#
#
# Opinionated
#
# A collection of tmux bindings packaged for the tmux plugin manager.
#
# General strategy:
#   prefix + lower case -> operations on windows and panes
#   prefix + upper case -> operations on sessions
#   control -> do the opposite
#
#   use the following mnemonics:
#     c -> copy
#     n -> new
#     d -> detach
#     r -> rename
#     x -> kill
#     m -> monitor
#     l -> link
#     [ -> move left
#     ] -> move right
#-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-#

#-----------------------------------------------------------------------------#
#
# Remove the following default bindings
#
# We will either override these bindings or not use them at all because they
# are not easy to remember.
#
#-----------------------------------------------------------------------------#

unbind-key '$'       # rename-session
unbind-key ','       # rename-window
unbind-key '%'       # split-window -h
unbind-key '"'       # split-window
unbind-key '{'       # swap-pane -U
unbind-key '}'       # swap-pane -D
unbind-key '['       # copy-mode
unbind-key ']'       # paste-buffer
unbind-key "'"       # select-window
unbind-key 'n'       # next-window
unbind-key 'p'       # previous-window
unbind-key 'l'       # last-window
unbind-key 'M-n'     # next window with alert
unbind-key 'M-p'     # next window with alert
unbind-key 'o'       # focus thru panes
unbind-key '&'       # kill-window
unbind-key '#'       # list-buffer
unbind-key '='       # choose-buffer
unbind-key 'z'       # zoom-pane
unbind-key 'M-Up'    # resize 5 rows up
unbind-key 'M-Down'  # resize 5 rows down
unbind-key 'M-Right' # resize 5 rows right
unbind-key 'M-Left'  # resize 5 rows left

#-----------------------------------------------------------------------------#
#
# Bindings for sessions
#
#-----------------------------------------------------------------------------#

set-option -g prefix C-a

bind-key N new-session -c "#{pane_current_path} \; command-prompt -I \"#{window_name}\" \"rename-window '%%'\""
bind-key D detach-client
bind-key R command-prompt -I "#{session_name}" "rename-session '%%'"
bind-key L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"
bind-key X confirm-before -p "kill-session #S? (y/n)" kill-session

#bind-key E new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} $(tmuxconf) && tmux source $(tmuxconf) && tmux display \"Config reloaded\"'"
#bind-key C-r "source-file $(tmuxconf) ; display 'Config reloaded'"
bind-key S if -F '#{s/off//:status}' 'set status off' 'set status on'

# Merge session with another one (e.g. move all windows)
# If you use adhoc 1-window sessions, and you want to preserve session upon exit
# but don't want to create a lot of small unnamed 1-window sessions around
# move all windows from current session to main named one (dev, work, etc)
bind-key M command-prompt -p "Session to merge with: " \
    "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# TODO: decide if this is worth having
# bind-key D if -F '#{session_many_attached}' \
#       'confirm-before -p "Detach other clients? (y/n)" "detach-client -a"' \
#       'display "Session has only 1 client attached"'

#-----------------------------------------------------------------------------#
#
# Bindings for windows
#
#-----------------------------------------------------------------------------#

bind-key n new-window -c '#{pane_current_path}' \; command-prompt -I '#{window_name}' 'rename-window %%'
bind-key r command-prompt -I "#{window_name}" "rename-window '%%'"
bind-key x confirm-before -p "kill-window #I:#{window_name}? (y/n)" kill-window
bind-key -r C-Tab last-window
bind-key -r Tab last-pane
bind-key -r C-Left previous-window
bind-key -r C-Right next-window
bind-key -r "C-[" previous-window
bind-key -r "C-]" next-window
bind-key C-X confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind-key m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind-key C-m if -F '#{monitor-silence}' 'setw monitor-silence 0 \; display-message \"Monitor window silence [OFF]\"' 'command-prompt -p \"Monitor silence: interval (s)\" \"setw monitor-silence %%\"'

#-----------------------------------------------------------------------------#
#
# Bindings for panes
#
#-----------------------------------------------------------------------------#

bind-key Delete confirm-before -p "kill-pane (y/n)" kill-pane
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "_" split-window -v -c "#{pane_current_path}"
bind-key -r Left select-pane -t :.-
bind-key -r Right select-pane -t :.+
bind-key -r "[" select-pane -t :.-
bind-key -r "]" select-pane -t :.+
bind-key -r "C-o" swap-pane -D
bind-key + resize-pane -Z

# Swap panes back and forth with 1st pane
# When in main-(horizontal|vertical) layouts, the biggest/widest panel is always @1
bind-key "\\" if '[ #{pane_index} -eq 1 ]' \
'swap-pane -s "!"' \
'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

# Pasting
bind-key p paste-buffer
bind-key C-p choose-buffer

#-----------------------------------------------------------------------------#
#
# Bindings for copy-mode
#
#-----------------------------------------------------------------------------#

bind-key "-n" M-Up copy-mode

# Scroll up/down by 1 line, half screen, whole screen
bind-key "-T" copy-mode-vi M-Up              send-keys -X scroll-up
bind-key "-T" copy-mode-vi M-Down            send-keys -X scroll-down
bind-key "-T" copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind-key "-T" copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind-key "-T" copy-mode-vi PageDown          send-keys -X page-down
bind-key "-T" copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
# TODO: resolve 'not in a mode'
#tmux bind-key "-T" copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
#tmux bind-key "-T" copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# vim: ft=tmux
